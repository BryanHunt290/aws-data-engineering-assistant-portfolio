name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo
          --no-banner
          --no-color
          --redact
          --gitleaks-ignore-path /repo/.gitleaksignore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          --constraint constraints.txt
          --requirement requirements.txt
          --requirement requirements-dev.txt

      - name: Set up Node.js for the CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk@2.1133.0

      - name: Compile Python sources
        run: >-
          python -m compileall
          app.py bookkeeping config data_engineering_assistant_cdk
          evaluation knowledge lambda scripts tests ui

      - name: Run offline test suite
        run: python -m pytest tests

      - name: Validate AWS pipeline operations dataset
        run: |
          python -m scripts.generate_aws_pipeline_operations_dataset --check
          python -m scripts.validate_aws_pipeline_operations_dataset

      - name: Evaluate AWS pipeline operations test split
        run: >-
          python -m evaluation.run_aws_pipeline_operations_evaluation
          --split test
          --output-dir "${RUNNER_TEMP}/aws-pipeline-operations-results"
          --evaluated-at "2026-08-06T00:00:00Z"
          --git-commit "${GITHUB_SHA}"

      - name: Run retrieval comparison
        run: >-
          python -m evaluation.run_retrieval_comparison
          --output-dir "${RUNNER_TEMP}/retrieval-results"
          --evaluated-at "2026-07-27T00:00:00Z"

      - name: Run LLM and prompt comparison
        run: >-
          python -m evaluation.run_llm_prompt_comparison
          --output-dir "${RUNNER_TEMP}/prompt-results"
          --evaluated-at "2026-07-27T00:00:00Z"
          --git-commit "${GITHUB_SHA}"

      - name: Run synthetic monitoring analysis
        run: |
          python -m evaluation.generate_monitoring_fixture \
            --output "${RUNNER_TEMP}/synthetic-events.jsonl"
          python -m evaluation.run_monitoring_report \
            --input "${RUNNER_TEMP}/synthetic-events.jsonl" \
            --output-dir "${RUNNER_TEMP}/monitoring-results" \
            --evaluated-at "2026-07-27T00:00:00Z" \
            --git-commit "${GITHUB_SHA}"

      - name: Check patch whitespace
        run: git diff --check

      - name: Synthesize legacy-compatible internal stack
        run: >-
          cdk synth DataEngineeringAssistantCdkStack
          -c client=internal-dev
          --no-lookups
          --output "${RUNNER_TEMP}/cdk.out"

      - name: Build offline release container
        run: docker build -t data-engineering-assistant:ci .
