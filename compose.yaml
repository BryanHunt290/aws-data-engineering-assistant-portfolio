x-application-environment: &application-environment
  AWS_REGION: ${AWS_REGION:-us-west-2}
  APP_EMBEDDING_MODEL_ID: ${APP_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
  APP_LLM_MODEL_ID: ${APP_LLM_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
  APP_DEFAULT_CLIENT_ID: ${APP_DEFAULT_CLIENT_ID:-demo-client}
  APP_DEFAULT_ENVIRONMENT: ${APP_DEFAULT_ENVIRONMENT:-dev}
  APP_RETRIEVAL_TOP_K: ${APP_RETRIEVAL_TOP_K:-5}
  APP_MINIMUM_SIMILARITY: ${APP_MINIMUM_SIMILARITY:-0.0}
  APP_MAXIMUM_CONVERSATION_MESSAGES: ${APP_MAXIMUM_CONVERSATION_MESSAGES:-10}
  APP_DEVELOPER_MODE: ${APP_DEVELOPER_MODE:-false}
  APP_PRICING_CATALOG_PATH: ${APP_PRICING_CATALOG_PATH:-knowledge/pricing_catalog.json}

x-application-service: &application-service
  build:
    context: .
    dockerfile: Dockerfile
  image: data-engineering-assistant:local
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen(
        'http://127.0.0.1:8501/_stcore/health', timeout=3).read()
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  demo:
    <<: *application-service
    environment:
      <<: *application-environment
      APP_RUNTIME_MODE: demo
    ports:
      - "${APP_PORT:-8501}:8501"

  bedrock:
    <<: *application-service
    profiles:
      - bedrock
    environment:
      <<: *application-environment
      APP_RUNTIME_MODE: bedrock
    ports:
      - "${BEDROCK_APP_PORT:-8502}:8501"

  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    profiles:
      - local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c '</dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  qdrant_storage:
